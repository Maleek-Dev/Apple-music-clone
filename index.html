<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Music Web App</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
</head>
<body>

    <!-- This is the sidebar -->
    <aside class="sidebar">
                    <div class="sidebar_content">
                        <div class="side_up">
                            <img src="./images/applelogo.png" alt="apple logo">
                            <div class="place">
                                <button><img src="./images/search_.png" alt="search"></button>
                                 <input type="text" placeholder="search">
                            </div>
                             <div class="side_middle">
                                <div class="middle_details">
                                     <div class="d1">
                                    <img src="./images/home_.png" alt="">
                                    <h4>Home</h4>
                                    </div>
                                </div>
                                <div class="middle_details">
                                    <div class="d2">
                                        <img src="./images/menu-circle_.png" alt="">
                                    <h4>New</h4>
                                    </div>
                                    
                            </div>
                            <div class="middle_details">
                                <div class="d3">
                                    <img src="./images/radio_.png" alt="">
                                    <h4>Radio</h4>
                                </div>
                                    
                            </div>
                        </div>
                            </div>
                    

                        <div class="side_down">
                                <img src="./images/iconmusic.png" alt="">
                                <p>Open in Music</p>
                                <img src="./images/uparrow.png" style="width: 10px; height: 10px;" alt="">
                        </div>
                    </div>

    </aside>

    <!-- This is the navbar -->
    <nav class="nav">
        <div class="nav_content">
            <div class="grid1">
                <img src="./images/shuffle_ (1).png" alt="">
                <img src="./images/backward_.png" alt="">
                <img src="./images/play_.png" alt="">
                <img src="./images/forward_ (1).png" alt="">
                <img src="./images/shuffle_.png" alt="">
            </div>
            <div class="grid1"></div>
            <div class="grid1"></div>
        </div>
    </nav>

</body>
</html>
